name: Deploy Firebase Functions Only

on:
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend app shell
        run: npm run build

      - name: Install Functions dependencies
        working-directory: ai_backend
        run: npm ci --legacy-peer-deps

      - name: Patch firebase-functions (remove extensions key for v12 CLI)
        run: node scripts/patch-firebase-functions.cjs

      - name: Package app shell for social-bot SEO
        run: cp dist/index.html ai_backend/index.html

      - name: Clean firebase.json (functions-only for Spark)
        run: node scripts/clean-firebase-json.cjs

      - name: Install Firebase CLI (latest — nodejs22 runtime + native extensions-key support)
        run: npm install -g firebase-tools

      - name: Show versions
        run: |
          echo "firebase-tools: $(firebase --version)"
          echo "node: $(node --version)"

      - name: Write ai_backend/.env from GitHub Secrets (runtime env-vars)
        working-directory: ai_backend
        shell: bash
        env:
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          S_TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          S_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S_GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          S_SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          S_AGENT_ADMIN_TOKEN: ${{ secrets.AGENT_ADMIN_TOKEN }}
          S_ARTICLE_ADMIN_EMAILS: ${{ secrets.ARTICLE_ADMIN_EMAILS }}
        run: node ../scripts/write-functions-env.cjs

      - name: Deploy Firebase Functions (v1 — Spark plan free)
        run: firebase deploy --only functions:api,functions:serverSideMetaTags,functions:rssFeed,functions:generateSitemapIndex,functions:generateSitemapMain,functions:generateSitemapBlogs,functions:generateSitemapJobs,functions:generateSitemapTests,functions:generateSitemapStories,functions:generateSitemapUpdates,functions:generateSitemapNews,functions:generateSitemapCourses,functions:generateSitemapMaterials,functions:generateSitemap,functions:generateRss,functions:pingIndexNow,functions:bulkIndexNow,functions:recentUrls,functions:recentUrlsTxt --project studymaterial-406ad --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
