name: Deploy Firebase Functions Only

# Spark-plan-safe deploy for studygyaan.in (free tier, no Blaze)
# - firebase-tools v12.4.0 (Node 20 support hai, v13 jaisa Blaze extensions enforcement nahi hai)
# - firebase.json ko deploy se pehle poora over-write kar dete hain clean minimal config se
# - Sirf HTTP functions deploy honge (Blaze-only onIndexPing_* triggers nahi)

on:
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend app shell
        run: npm run build

      - name: Install Functions dependencies
        working-directory: ai_backend
        run: npm ci --legacy-peer-deps

      - name: Package app shell for social-bot SEO
        run: cp dist/index.html ai_backend/index.html

      - name: Overwrite firebase.json with clean minimal config (extensions/emulators/hosting hata diya — sirf functions)
        run: |
          cat > firebase.json << 'FBJSON'
          {
            "functions": [
              {
                "source": "ai_backend",
                "codebase": "default",
                "ignore": [
                  "node_modules",
                  ".git",
                  "firebase-debug.log",
                  "firebase-debug.*.log",
                  "*.local"
                ]
              }
            ]
          }
          FBJSON
          echo "=== firebase.json contents ==="
          cat firebase.json
          echo ""
          echo "=== Verifying no 'extensions' key present ==="
          if grep -q "extensions" firebase.json; then
            echo "FAIL: extensions key still present!"
            exit 1
          else
            echo "OK: No extensions key found"
          fi

      - name: Install Firebase CLI v12.4.0
        run: npm install -g firebase-tools@12.4.0

      - name: Show firebase-tools version
        run: firebase --version

      - name: Deploy selected Firebase Functions
        run: |
          firebase deploy \
            --only functions:serverSideMetaTags,functions:rssFeed,functions:generateSitemapIndex,functions:generateSitemapMain,functions:generateSitemapBlogs,functions:generateSitemapJobs,functions:generateSitemapTests,functions:generateSitemapStories,functions:generateSitemapUpdates,functions:generateSitemapNews,functions:generateSitemapCourses,functions:generateSitemapMaterials,functions:generateSitemap,functions:generateRss,functions:pingIndexNow,functions:bulkIndexNow,functions:recentUrls,functions:recentUrlsTxt \
            --project studymaterial-406ad \
            --non-interactive \
            --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
