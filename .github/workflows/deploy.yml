name: Deploy Firebase Functions Only

on:
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend app shell
        run: npm run build

      - name: Install Functions dependencies
        working-directory: ai_backend
        run: npm ci --legacy-peer-deps

      - name: Package app shell for social-bot SEO
        run: cp dist/index.html ai_backend/index.html

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy selected Firebase Functions safely
        run: |
          firebase deploy --only "functions:api,functions:serverSideMetaTags,functions:generateSitemapIndex,functions:generateSitemapMain,functions:generateSitemapBlogs,functions:generateSitemapJobs,functions:generateSitemapTests,functions:generateSitemapStories,functions:generateSitemapUpdates,functions:generateSitemapNews,functions:generateSitemap,functions:generateRss" --project studymaterial-406ad --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
