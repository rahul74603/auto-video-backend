name: Deploy Firebase Functions Only

# Spark / non-Blaze safe deploy:
# - ai_backend/package.json "main" = seo_export.js (no schedules, no Firestore triggers, no Secret Manager bindings)
# - firebase-tools pinned to v12.9.1 (v13+ Blaze plan extensions deta hai Spark pe)
# - Deploy list me sirf HTTP functions hain (Blaze-only onIndexPing_* triggers nahi hain)

on:
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend app shell
        run: npm run build

      - name: Install Functions dependencies
        working-directory: ai_backend
        run: npm ci --legacy-peer-deps

      - name: Package app shell for social-bot SEO
        run: cp dist/index.html ai_backend/index.html

      - name: Install Firebase CLI (v12.9.1 — v13+ Spark pe Blaze plan error deta hai)
        run: npm install -g firebase-tools@12.9.1

      - name: Deploy selected Firebase Functions safely
        run: |
          firebase deploy \
            --only "functions:serverSideMetaTags,functions:rssFeed,functions:generateSitemapIndex,functions:generateSitemapMain,functions:generateSitemapBlogs,functions:generateSitemapJobs,functions:generateSitemapTests,functions:generateSitemapStories,functions:generateSitemapUpdates,functions:generateSitemapNews,functions:generateSitemapCourses,functions:generateSitemapMaterials,functions:generateSitemap,functions:generateRss,functions:pingIndexNow,functions:bulkIndexNow,functions:recentUrls,functions:recentUrlsTxt" \
            --project studymaterial-406ad \
            --non-interactive \
            --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
