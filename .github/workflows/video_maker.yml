name: 🎬 Auto Video Generator

on:
  repository_dispatch:
    types: [generate_video]

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ai_backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Debug Data
        run: |
          echo "================================"
          echo "Title : ${{ github.event.client_payload.jobData.title }}"
          echo "Slug  : ${{ github.event.client_payload.jobData.slug }}"
          echo "Cat   : ${{ github.event.client_payload.jobData.category }}"
          echo "================================"

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔧 System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: 📦 NPM Install
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: 🎬 Generate Video
        env:
          JOB_DATA:             ${{ toJson(github.event.client_payload.jobData) }}
          GMAIL_CREDENTIALS:    ${{ secrets.GMAIL_CREDENTIALS }}
          YOUTUBE_TOKEN:        ${{ secrets.YOUTUBE_TOKEN }}
          TTS_KEY_JSON:         ${{ secrets.TTS_KEY_JSON }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN:        ${{ secrets.FB_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node autoVideo.js

      - name: ✅ Success
        if: success()
        run: echo "🎉 Video YouTube पर Live!"

      - name: ❌ Failed
        if: failure()
        run: echo "💥 Video fail! Logs check करें।"
