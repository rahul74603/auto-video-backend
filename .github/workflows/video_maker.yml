name: 🎬 Auto Video Generator

on:
  repository_dispatch:
    types: [generate_video, generate_job_video, generate_fasttrack_video]

# ✅ यही FIX है - दोनों simultaneously चल सकें
concurrency:
  group: video-${{ github.event.client_payload.jobData.slug }}
  cancel-in-progress: false

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ai_backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛑 Check Automation Switch (video_maker)
        id: automation_check
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          node check_automation.js video_maker || STATUS=$?
          if [ "$STATUS" = "78" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "⏸️ video_maker paused — skipping workflow"
            exit 0
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi


      - name: 🔍 Debug Data
        if: steps.automation_check.outputs.enabled == 'true'
        run: |
          echo "================================"
          echo "Event : ${{ github.event_name }}"
          echo "Type  : ${{ github.event.action }}"
          echo "Title : ${{ github.event.client_payload.jobData.title }}"
          echo "Slug  : ${{ github.event.client_payload.jobData.slug }}"
          echo "Cat   : ${{ github.event.client_payload.jobData.category }}"
          echo "JobType: ${{ github.event.client_payload.jobData.type }}"
          echo "================================"

      - name: 📦 Setup Node.js
        if: steps.automation_check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔧 System Dependencies
        if: steps.automation_check.outputs.enabled == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: 📦 NPM Install
        if: steps.automation_check.outputs.enabled == 'true'
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: 🎬 Generate Video
        env:
          JOB_DATA:              ${{ toJson(github.event.client_payload.jobData) }}
          GMAIL_CREDENTIALS:     ${{ secrets.GMAIL_CREDENTIALS }}
          YOUTUBE_TOKEN:         ${{ secrets.YOUTUBE_TOKEN }}
          TTS_KEY_JSON:          ${{ secrets.TTS_KEY_JSON }}
          SERVICE_ACCOUNT_JSON:  ${{ secrets.SERVICE_ACCOUNT_JSON }}
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN:         ${{ secrets.FB_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_LINK: ${{ secrets.TELEGRAM_CHANNEL_LINK }}
          TELEGRAM_CHANNEL_NAME: ${{ secrets.TELEGRAM_CHANNEL_NAME }}
        run: node autoVideo.js

      - name: ✅ Success
        if: success()
        run: |
          echo "🎉 Video YouTube पर Live!"
          echo "Title: ${{ github.event.client_payload.jobData.title }}"
          echo "Type:  ${{ github.event.client_payload.jobData.type }}"

      - name: ❌ Failed
        if: failure()
        run: |
          echo "💥 Video fail!"
          echo "Title: ${{ github.event.client_payload.jobData.title }}"
