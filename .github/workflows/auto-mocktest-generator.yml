name: Auto Mock Test Generator

on:
  schedule:
    # GitHub UTC टाइम पर चलता है (IST = UTC + 5:30)
    # 30 3,6,9,12,15 * * * (UTC) का मतलब है भारतीय समय अनुसार:
    # सुबह 9:00, दोपहर 12:00, 3:00, शाम 6:00, और रात 9:00
    - cron: '30 3,6,9,12,15 * * *'
  workflow_dispatch: # बटन दबाकर मैन्युअली रन करने के लिए
    inputs:
      topic:
        description: 'Optional: is topic par test banao (blank = admin request queue / random)'
        required: false
        default: ''

jobs:
  generate-mock-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      enabled: ${{ steps.automation_check.outputs.enabled }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ai_backend/package-lock.json

      - name: 🛑 Check Automation Switch (mock_test)
        id: automation_check
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        working-directory: ai_backend
        run: |
          npm install --no-save --ignore-scripts --legacy-peer-deps axios firebase-admin 2>&1 | tail -n 5 || true
          STATUS=0
          node check_automation.js mock_test || STATUS=$?
          if [ "$STATUS" = "78" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "⏸️ mock_test paused — skipping workflow"
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

      # npm ci (lockfile) — pehle ad-hoc `npm install <4 pkgs>` hota tha jisme
      # googleapis MISSING tha, jisse auto_mock.js MODULE_NOT_FOUND crash hota
      # tha aur ek bhi mock test nahi banta tha.
      - name: Install Packages (npm ci — lockfile preserved)
        if: steps.automation_check.outputs.enabled == 'true'
        working-directory: ai_backend
        run: npm ci --ignore-scripts

      - name: Run Auto Mock Generator
        if: steps.automation_check.outputs.enabled == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          MOCK_MANUAL_TOPIC: ${{ github.event.inputs.topic }}
        working-directory: ai_backend
        run: node auto_mock.js

      - name: ❌ Failure notice
        if: failure()
        run: echo "💥 Mock generator run failed — logs me Auto-Mock Error dekho (GEMINI_API_KEY / JSON parse / Firestore)."

  # ⚡ Incremental SEO: publish ke minutes me naye URLs live
  # (sitemap+meta+news+nav+IndexNow). Spark-safe (~25 reads), self-gating.
  seo-quick-add:
    needs: [generate-mock-test]
    if: needs.generate-mock-test.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "⚡ SEO Quick-Add (incremental: test)"
        uses: ./.github/actions/seo-quick-add
        with:
          type: test
          firebase-service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.SERVICE_ACCOUNT_JSON }}
          ftp-server: ${{ secrets.FTP_SERVER }}
          ftp-username: ${{ secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          ftp-server-dir: ${{ secrets.FTP_SERVER_DIR }}
