name: StudyGyaan Auto Blogger v4 (Discover-First) 🌟

# 🌟 v4 POLICY: din me SIRF 2 blogs (subah 8:30 + shaam 6:30 IST) — best
# quality, trend-grounded, Discover-optimized. Quantity nahi, quality.
on:
  schedule:
    - cron: '30 3 * * *'    # 03:30 UTC = 8:30 AM IST
    - cron: '30 13 * * *'   # 13:30 UTC = 6:30 PM IST
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      enabled: ${{ steps.automation_check.outputs.enabled }}

    defaults:
      run:
        working-directory: ai_backend

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🛑 Check Automation Switch (auto_blog)
        id: automation_check
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          npm install --ignore-scripts --legacy-peer-deps firebase-admin axios 2>&1 | tail -n 3 || true
          node check_automation.js auto_blog || STATUS=$?
          if [ "$STATUS" = "78" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "⏸️ auto_blog paused — skipping workflow"
            exit 0
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi


      # 🔥 Node FIX (stable)
      - name: ⚙️ Setup Node.js
        if: steps.automation_check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ai_backend/package-lock.json

      # 📦 Install dependencies (lockfile se — deterministic, tez)
      - name: 📦 Install Dependencies
        if: steps.automation_check.outputs.enabled == 'true'
        run: npm ci --legacy-peer-deps

      # 🚀 Run Auto Blogger v4
      - name: 🤖 Run Auto Blogger Script
        if: steps.automation_check.outputs.enabled == 'true'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOG_DAILY_CAP: '2'
        run: node auto_blog.js

  # ⚡ Incremental SEO: publish ke minutes me naya blog live
  # (full seo-daily ki jagah — Spark quota: ~25 reads vs ~3,300!)
  seo-quick-add:
    needs: [build_and_publish]
    if: needs.build_and_publish.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout (local action se pehle zaroori)
        uses: actions/checkout@v4

      - name: "⚡ SEO Quick-Add (incremental: blog)"
        uses: ./.github/actions/seo-quick-add
        with:
          type: blog
          firebase-service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.SERVICE_ACCOUNT_JSON }}
          ftp-server: ${{ secrets.FTP_SERVER }}
          ftp-username: ${{ secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          ftp-server-dir: ${{ secrets.FTP_SERVER_DIR }}
