name: Data Compressor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  compress-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install NPM Packages
        run: npm install

      - name: Install Ghostscript and Run Compressor
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: sudo apt-get update && sudo apt-get install -y ghostscript && node ai_backend/global_compressor.js
