name: Daily Job Alert

on:
  schedule:
    - cron: '0 3 * * *'  # सुबह 8:30 बजे IST (03:00 UTC)
  workflow_dispatch: 

jobs:
  # 🛑 Automation guard
      - name: 🛑 Check Automation Switch (daily_alert)
        id: automation_check
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        working-directory: ai_backend
        run: |
          npm install --ignore-scripts --legacy-peer-deps axios firebase-admin 2>&1 | tail -n 5 || true
          node check_automation.js daily_alert || STATUS=$?
          if [ "$STATUS" = "78" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "⏸️ daily_alert paused — skipping workflow"
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

  run-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        if: steps.automation_check.outputs.enabled == 'true'
        uses: actions/checkout@v3

      - name: Setup Node.js
        if: steps.automation_check.outputs.enabled == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        if: steps.automation_check.outputs.enabled == 'true'
        run: |
          npm install --legacy-peer-deps
          if [ -d "ai_backend" ]; then cd ai_backend && npm install --legacy-peer-deps || true; fi

      - name: Trigger Daily Alert (Node Script)
        if: steps.automation_check.outputs.enabled == 'true'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node ai_backend/daily_alert.js
