name: Auto Mock Test Video Maker

on:
  schedule:
    - cron: '0 3 * * *'   # सुबह 08:30 AM IST (03:00 UTC)
    - cron: '0 15 * * *'  # रात 08:30 PM IST (15:00 UTC)
  workflow_dispatch:

jobs:
  # 🛑 Automation guard
      - name: 🛑 Check Automation Switch (mock_test)
        id: automation_check
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        working-directory: ai_backend
        run: |
          npm install --ignore-scripts --legacy-peer-deps axios firebase-admin 2>&1 | tail -n 5 || true
          node check_automation.js mock_test || STATUS=$?
          if [ "$STATUS" = "78" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "⏸️ mock_test paused — skipping workflow"
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

  run-mock-test-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        if: steps.automation_check.outputs.enabled == 'true'
        uses: actions/checkout@v3

      - name: Setup Node.js
        if: steps.automation_check.outputs.enabled == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        if: steps.automation_check.outputs.enabled == 'true'
        run: |
          npm install --legacy-peer-deps
          if [ -d "ai_backend" ]; then cd ai_backend && npm install --legacy-peer-deps || true; fi

      - name: Generate Mock Test Video
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          TTS_KEY_JSON: ${{ secrets.TTS_KEY_JSON }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          YOUTUBE_TOKEN_SELF_TEST: ${{ secrets.YOUTUBE_TOKEN_SELF_TEST }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node ai_backend/mock_test_video.js
