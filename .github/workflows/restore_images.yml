name: 🚑 Fix Image Links (JPG to WebP)

on:
  workflow_dispatch:

jobs:
  recover-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Firebase Admin
        # 🔥 Yahan --legacy-peer-deps hai taaki npm error na aaye
        run: npm install firebase-admin dotenv --legacy-peer-deps

      - name: 🚨 Run Link Update Script
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: node ai_backend/restore_images.js
