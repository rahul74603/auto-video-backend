name: Automatic Payment Checker

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  verify_payments:
    runs-on: ubuntu-latest

    # 👇 यह सुनिश्चित करता है कि GitHub Actions ai_backend फोल्डर के अंदर काम करे
    defaults:
      run:
        working-directory: ai_backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 🛑 Check Automation Switch (payment_checker)
        id: automation_check
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          npm install --ignore-scripts --legacy-peer-deps firebase-admin axios 2>&1 | tail -n 3 || true
          node check_automation.js payment_checker || STATUS=$?
          if [ "$STATUS" = "78" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "⏸️ payment_checker paused — skipping workflow"
            exit 0
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi


      - name: Setup Node.js
        if: steps.automation_check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        if: steps.automation_check.outputs.enabled == 'true'
        run: npm install --legacy-peer-deps

      - name: Run Payment Checker
        if: steps.automation_check.outputs.enabled == 'true'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          PAYMENT_GMAIL_TOKEN: ${{ secrets.PAYMENT_GMAIL_TOKEN }}
        # working-directory की वजह से ./payment_checker.js अपने आप मिल जाएगी
        run: node -e 'require("./payment_checker.js").checkPayments().then(() => process.exit(0)).catch(e => { console.error(e); process.exit(1); })'
