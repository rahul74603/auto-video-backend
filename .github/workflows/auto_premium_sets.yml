# =====================================================================
#  Auto Premium Set Generator (PHASE-3 v3) — .github/workflows/auto_premium_sets.yml
#  Timing: 2:30 AM IST (slot 0) · 3:20 AM IST (slot 1)
#  Secrets: SERVICE_ACCOUNT_JSON, GEMINI_API_KEY, SETS_GEMINI_API_KEY (paid)
#  Cost rule: pehle 3 retry FREE flash → fail to paid flash-lite (sirf sets)
# =====================================================================
name: Auto Premium Set Generator

on:
  schedule:
    - cron: '0 21 * * *'   # 2:30 AM IST
    - cron: '50 21 * * *'  # 3:20 AM IST
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot (0 = first exam entry, 1 = next)'
        default: '0'

jobs:
  generate-slot-0:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 21 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ai_backend deps
        run: npm ci --ignore-scripts
        working-directory: ai_backend
      - name: Generate premium set (slot 0)
        working-directory: ai_backend
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SETS_GEMINI_API_KEY: ${{ secrets.SETS_GEMINI_API_KEY }}
        run: node run_auto_premium_sets.js --slot=${{ github.event.inputs.slot || '0' }}

  generate-slot-1:
    if: github.event.schedule == '50 21 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ai_backend deps
        run: npm ci --ignore-scripts
        working-directory: ai_backend
      - name: Generate premium set (slot 1)
        working-directory: ai_backend
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SETS_GEMINI_API_KEY: ${{ secrets.SETS_GEMINI_API_KEY }}
        run: node run_auto_premium_sets.js --slot=1
