name: StudyGyaan PDF Generator

on:
  workflow_dispatch: # मैन्युअल बटन
  schedule:
    - cron: '0 5 * * *' # रोज़ सुबह 10:30 AM IST

jobs:
  pdf-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          # Ghostscript इन्सटॉल करें ताकि PDF कंप्रेस हो सके
          sudo apt-get update && sudo apt-get install -y ghostscript
          npm install --legacy-peer-deps
          npm install puppeteer firebase-admin dotenv @google/generative-ai --legacy-peer-deps

      - name: 🔥 Run AutoPDF Engine
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node ai_backend/autoPdf.js
