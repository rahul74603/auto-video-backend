name: Auto Post to Facebook

on:
  workflow_dispatch:

jobs:
  post_to_fb:
    runs-on: ubuntu-latest

    # 👇 यह लाइन GitHub को ai_backend फोल्डर के अंदर काम करने को कहेगा
    defaults:
      run:
        working-directory: ai_backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🛑 Check Automation Switch (fb_post)
        id: automation_check
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          node check_automation.js fb_post || STATUS=$?
          if [ "$STATUS" = "78" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "⏸️ fb_post paused — skipping workflow"
            exit 0
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi


      - name: Setup Node.js
        if: steps.automation_check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Facebook Poster Script
        if: steps.automation_check.outputs.enabled == 'true'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node fb_poster.js
