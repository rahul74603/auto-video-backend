name: Daily SEO - Sitemaps + IndexNow (FREE)

# NOTE: auto_blog.yml har publish ke baad isko auto-trigger karta hai
# (reusable workflow_call) — taaki naya blog minutes me sitemap + bot-JSON
# me aa jaye. Manual/schedule runs jaise the waise hi chalte hain.
on:
  schedule:
    - cron: "30 0 * * *"   # roz subah 6:00 AM IST
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = naye URLs only | bulk = SAARE URLs IndexNow pe (pehli baar ye chalao)"
        required: false
        default: "daily"
  workflow_call:
    inputs:
      mode:
        description: "daily = naye URLs only | bulk = SAARE URLs"
        required: false
        default: "daily"
        type: string

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (sirf firebase-admin)
        working-directory: seo_static
        run: npm install --no-audit --no-fund

      - name: Generate sitemaps + RSS + recent-urls
        working-directory: seo_static
        env:
          # Dono secret-naam support (purani staging copy wala fallback merge kiya)
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.SERVICE_ACCOUNT_JSON }}
        run: node generate.cjs --out ../seo_out

      # 🔁 FTP auto-retry: Hostinger control-socket ETIMEDOUT jaise transient blip
      # khud heal (60s gap, 3 attempts). Teeno fail = gate step red (asli problem).
      # continue-on-error: beech ka fail downstream verify/IndexNow ko rokta NAHI.
      - name: Upload to cPanel via FTP (attempt 1/3)
        id: ftp1
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: seo_out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            _urls.json
      - name: FTP blip - 60s wait, phir retry
        if: steps.ftp1.outcome == 'failure'
        run: sleep 60
      - name: Upload to cPanel via FTP (attempt 2/3)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: seo_out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            _urls.json
      - name: FTP blip - 60s wait, phir aakhri retry
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: sleep 60
      - name: Upload to cPanel via FTP (attempt 3/3)
        id: ftp3
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: seo_out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            _urls.json
      - name: FTP 3 attempts me fail - asli problem
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure' && steps.ftp3.outcome == 'failure'
        run: echo "::error::FTP deploy 3 attempts me fail (server/network down?)." && exit 1

      # ✅ SELF-VERIFY (slim: HTTP-only, 0 Firestore reads): FTP ke turant baad
      # newest blogs/jobs/updates/stories/tests Googlebot UA se check. Koi
      # sitemap-listed URL bot-404 de to run YAHIN red + cache-forensics.
      - name: ✅ Verify deploy — newest content bot-visible (diag slim)
        run: node ai_backend/diag_site_health.js --slim

      # ⏭️ Verify red hui to ye step auto-skip (toote URLs Bing ko mat bhejo)
      - name: Submit URLs to IndexNow (Bing/Yandex/Seznam)
        working-directory: seo_static
        run: node indexnow.cjs ${{ inputs.mode || github.event.inputs.mode || 'daily' }}
