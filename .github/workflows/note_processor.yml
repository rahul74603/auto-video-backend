name: AI Note Processor

on:
  schedule:
    - cron: '*/10 * * * *' # ✅ हर 10 मिनट में रन होगा
  workflow_dispatch: # मैन्युअल रन करने के लिए

jobs:
  process_notes:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai_backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 🛑 Check Automation Switch (note_processor)
        id: automation_check
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          node check_automation.js note_processor || STATUS=$?
          if [ "$STATUS" = "78" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "⏸️ note_processor paused — skipping workflow"
            exit 0
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi


      - name: Setup Node.js
        if: steps.automation_check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        if: steps.automation_check.outputs.enabled == 'true'
        run: npm install --legacy-peer-deps

      - name: Run AI Note Processor
        if: steps.automation_check.outputs.enabled == 'true'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node -e 'require("./note_processor.js").processNotes().then(() => process.exit(0)).catch(e => { console.error(e); process.exit(1); })'
