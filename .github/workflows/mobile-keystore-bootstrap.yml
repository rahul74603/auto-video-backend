name: Mobile Keystore Bootstrap (one-time)

# ONE-TIME: fixed sideload keystore banakar repo me commit karta hai, taaki har
# CI build same signature se sign ho (bina iske har APK alag key se sign hoga
# aur update install nahi hoga). Dobara chalane pe kuch nahi karta (guarded).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Setup Java 17 (keytool ke liye)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate + commit sideload keystore (guarded)
        run: |
          KS='mobile/android/app/sideload.keystore'
          if [ -f "$KS" ]; then
            echo "Keystore pehle se hai — kuch nahi karna."
            exit 0
          fi
          keytool -genkeypair -v \
            -keystore "$KS" -alias studygyaan \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass studygyaan -keypass studygyaan \
            -dname 'CN=StudyGyaan, OU=App, O=StudyGyaan, L=Jabalpur, S=MP, C=IN'
          git config user.name 'arena-agent'
          git config user.email 'arena-agent@users.noreply.github.com'
          git add "$KS"
          git commit -m 'Add fixed sideload keystore for reproducible APK signature'
          git push origin '${{ github.ref_name }}'
