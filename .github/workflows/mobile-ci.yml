name: Mobile CI (Flutter)

# Har push/PR pe: analyze + unit tests + debug APK.
# google-services.json ke BINA bhi build chalti hai (app setup-screen dikhata hai),
# isliye Firebase config kabhi CI red nahi karta.

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter (pinned — versions README me)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: TEMP DEBUG - post analyze output to PR
        if: failure() && github.event_name == 'pull_request'
        run: |
          flutter analyze > /tmp/analyze_full.txt 2>&1 || true
          python3 -c "print(open('/tmp/analyze_full.txt', errors='replace').read()[:60000])" > /tmp/analyze_short.txt
          { echo 'TEMP DEBUG - full flutter analyze output:'; echo '```'; cat /tmp/analyze_short.txt; echo '```'; } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md || echo COMMENT_FAILED
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug
