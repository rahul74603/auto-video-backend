name: Mobile CI (Flutter)

# Har push/PR pe: analyze + unit tests + debug APK.
# google-services.json ke BINA bhi build chalti hai (app setup-screen dikhata hai),
# isliye Firebase config kabhi CI red nahi karta.

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter (pinned — versions README me)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/an.txt

      - name: TEMP DEBUG - surface ALL analyze findings as annotations
        if: failure() && github.event_name == 'pull_request'
        run: |
          python3 - <<'PYEOF' || echo EMIT_FAILED
          import re
          lines = [l.rstrip('\n') for l in open('/tmp/an.txt', errors='replace')]
          n = 0
          def emit(level, where, msg):
            global n
            if n >= 45:
              return
            msg = re.sub(r'\s+', ' ', msg)[:400]
            print(f"::{level} {where}::{msg}")
            n += 1
          for line in lines:
            s = line.strip()
            if not s:
              continue
            m = re.search(r'\b(error|warning)\b', s)
            loc = re.search(r'([\w\-/]+\.dart|pubspec\.yaml|analysis_options\.yaml):(\d+):(\d+)', s)
            if m and loc:
              f, l, c = loc.group(1), loc.group(2), loc.group(3)
              if '/mobile/' in f:
                f = f.split('/mobile/', 1)[1]
              lvl = 'error' if m.group(1) == 'error' else 'warning'
              emit(lvl, f'file=mobile/{f},line={l},col={c}', s)
            elif m or 'issues found' in s or 'Analyzing' in s or 'no issues found' in s:
              emit('notice', 'file=.github/workflows/mobile-ci.yml', s)
          tail = [l.strip() for l in lines if l.strip()][-8:]
          for s in tail:
            emit('notice', 'file=.github/workflows/mobile-ci.yml', 'TAIL: ' + s)
          print(f"annotations emitted: {n}")
          PYEOF


      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug
