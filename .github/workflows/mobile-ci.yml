name: Mobile CI (Flutter)

# Har push/PR pe: analyze + unit tests + debug APK.
# google-services.json ke BINA bhi build chalti hai (app setup-screen dikhata hai),
# isliye Firebase config kabhi CI red nahi karta.

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter (pinned — versions README me)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: TEMP DEBUG - surface analyze findings as annotations
        if: failure() && github.event_name == 'pull_request'
        run: |
          flutter analyze --no-fatal-infos > /tmp/an.txt 2>&1 || true
          python3 - <<'PYEOF'
          import re
          n = 0
          for raw in open('/tmp/an.txt', errors='replace'):
            line = raw.strip()
            m = re.search(r'\b(error|warning)\b', line)
            loc = re.search(r'([\w\-/]+\.dart):(\d+):(\d+)', line)
            if m and loc and n < 50:
              sev, f, l, c = m.group(1), loc.group(1), loc.group(2), loc.group(3)
              msg = re.sub(r'\s+', ' ', line)[:400]
              print(f"::{'error' if sev == 'error' else 'warning'} file=mobile/{f},line={l},col={c}::{msg}")
              n += 1
          print(f"annotations emitted: {n}")
          PYEOF

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug
