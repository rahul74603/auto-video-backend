name: Mobile CI (Flutter)

# Har push/PR pe: analyze + unit tests + debug APK.
# google-services.json ke BINA bhi build chalti hai (app setup-screen dikhata hai),
# isliye Firebase config kabhi CI red nahi karta.

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter (pinned — versions README me)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/an.txt



      - name: Unit tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee /tmp/test.txt

      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee /tmp/build.txt

      - name: TEMP DEBUG - surface ALL failures as annotations
        if: failure() && github.event_name == 'pull_request'
        run: |
          python3 - <<'PYEOF' || echo EMIT_FAILED
          import re
          files = {'ANALYZE': '/tmp/an.txt', 'TEST': '/tmp/test.txt', 'BUILD': '/tmp/build.txt'}
          n = 0
          def emit(level, where, msg):
            global n
            if n >= 45:
              return
            msg = re.sub(r'\s+', ' ', msg)[:380]
            print(f"::{level} {where}::{msg}")
            n += 1
          for tag, path in files.items():
            try:
              lines = [l.rstrip('\n') for l in open(path, errors='replace')]
            except OSError:
              continue
            if not lines:
              continue
            emit('notice', 'file=.github/workflows/mobile-ci.yml', f'{tag}: {len(lines)} lines captured')
            for line in lines:
              s = line.strip()
              if not s:
                continue
              bad = re.search(r'\b(error|Error|ERROR|FAILED|FAIL|Exception|exited|failing)\b', s)
              if bad or 'test failed' in s.lower():
                loc = re.search(r'([\w\-/]+\.dart|pubspec\.yaml|analysis_options\.yaml|build\.gradle|settings\.gradle):(\d+)', s)
                if loc:
                  f = loc.group(1)
                  l = loc.group(2)
                  if '/mobile/' in f:
                    f = f.split('/mobile/', 1)[1]
                  emit('error', f'file=mobile/{f},line={l}', f'{tag}: {s}')
                else:
                  emit('notice', 'file=.github/workflows/mobile-ci.yml', f'{tag}: {s}')
            tail = [l.strip() for l in lines if l.strip()][-6:]
            for s in tail:
              emit('notice', 'file=.github/workflows/mobile-ci.yml', f'{tag} TAIL: {s}')
          print(f"annotations emitted: {n}")
          PYEOF
