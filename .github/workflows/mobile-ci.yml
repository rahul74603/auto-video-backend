name: Mobile CI (Flutter)

# Har push/PR pe: analyze + unit tests + debug APK.
# google-services.json ke BINA bhi build chalti hai (app setup-screen dikhata hai),
# isliye Firebase config kabhi CI red nahi karta.

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter (pinned — versions README me)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Flutter version
        run: flutter --version

      - name: Setup Java 17 (AGP 8.5 / Gradle 8.9 need JDK 17; runner default is too new)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/an.txt



      - name: Unit tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee /tmp/test.txt

      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee /tmp/build.txt


      - name: TEMP DEBUG - dump all step outputs as annotations
        if: failure() && github.event_name == 'pull_request'
        run: |
          python3 - <<'PYEOF' || echo EMIT_FAILED
          import re
          n = 0
          def emit(level, where, msg):
            global n
            if n >= 45:
              return
            msg = re.sub(r'\s+', ' ', msg)[:380]
            print(f"::{level} {where}::{msg}")
            n += 1
          def read(p):
            try:
              with open(p, errors='replace') as f:
                return [l.rstrip('\n') for l in f]
            except OSError:
              return []
          an, te, bu = read('/tmp/an.txt'), read('/tmp/test.txt'), read('/tmp/build.txt')
          emit('notice', 'file=.github/workflows/mobile-ci.yml', f'CAPTURED analyze={len(an)} test={len(te)} build={len(bu)}')
          for i, l in enumerate(te, 1):
            s = l.strip()
            if s:
              emit('notice', 'file=.github/workflows/mobile-ci.yml', f'TEST L{i:02d}: {s}')
          for s in [l.strip() for l in bu if l.strip()][-15:]:
            emit('notice', 'file=.github/workflows/mobile-ci.yml', f'BUILD TAIL: {s}')
          for s in [l.strip() for l in an if l.strip()][-5:]:
            emit('notice', 'file=.github/workflows/mobile-ci.yml', f'ANALYZE TAIL: {s}')
          print(f"annotations emitted: {n}")
          PYEOF
