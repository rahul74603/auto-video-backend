name: 🤖 Govt Jobs Scraper

on:
  schedule:
    - cron: '0 4 * * *'    # रोज़ 9:30 AM IST (4:00 UTC)
  workflow_dispatch:         # Manual Run बटन

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ai_backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛑 Check Automation Switch (govt_jobs)
        id: automation_check
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          npm install --ignore-scripts --legacy-peer-deps firebase-admin axios 2>&1 | tail -n 3 || true
          node check_automation.js govt_jobs || STATUS=$?
          if [ "$STATUS" = "78" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "⏸️ govt_jobs paused — skipping workflow"
            exit 0
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi


      - name: 📦 Setup Node
        if: steps.automation_check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'    # ✅ 24 से 20 (stable)

      - name: 📦 Install Dependencies
        if: steps.automation_check.outputs.enabled == 'true'
        run: npm install --legacy-peer-deps

      - name: 🤖 Run Scraper
        if: steps.automation_check.outputs.enabled == 'true'
        run: |
          node -e "
            require('./govt_jobs.js')
              .runJobScraper(5)
              .then(count => {
                console.log('✅ Done:', count, 'jobs saved');
                process.exit(0);
              })
              .catch(e => {
                console.error('❌ Error:', e.message);
                process.exit(1);
              });
          "
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
