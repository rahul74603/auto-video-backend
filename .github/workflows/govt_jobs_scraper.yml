name: 🤖 Govt Jobs Scraper

on:
  schedule:
    - cron: '0 4 * * *'    # रोज़ 9:30 AM IST (4:00 UTC)
  workflow_dispatch:         # Manual Run बटन

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ai_backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'    # ✅ 24 से 20 (stable)

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🤖 Run Scraper
        run: |
          node -e "
            require('./govt_jobs.js')
              .runJobScraper(5)
              .then(count => {
                console.log('✅ Done:', count, 'jobs saved');
                process.exit(0);
              })
              .catch(e => {
                console.error('❌ Error:', e.message);
                process.exit(1);
              });
          "
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
