name: 🤖 Govt Jobs Scraper

on:
  schedule:
    - cron: '0 0,6,12,18 * * *' # हर 6 घंटे: fresher source queue; IST 5:30, 11:30, 17:30, 23:30
  workflow_dispatch:         # Manual Run बटन

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      enabled: ${{ steps.automation_check.outputs.enabled }}

    defaults:
      run:
        working-directory: ai_backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛑 Check Automation Switch (govt_jobs)
        id: automation_check
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          npm install --ignore-scripts --legacy-peer-deps firebase-admin axios 2>&1 | tail -n 3 || true
          node check_automation.js govt_jobs || STATUS=$?
          if [ "$STATUS" = "78" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "⏸️ govt_jobs paused — skipping workflow"
            exit 0
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi


      - name: 📦 Setup Node
        if: steps.automation_check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'    # ✅ 24 से 20 (stable)

      - name: 📦 Install Dependencies
        if: steps.automation_check.outputs.enabled == 'true'
        run: npm install --legacy-peer-deps

      - name: 🤖 Run Scraper
        if: steps.automation_check.outputs.enabled == 'true'
        run: |
          node -e "
            require('./govt_jobs.js')
              .runJobScraper(5)
              .then(count => {
                console.log('✅ Done:', count, 'jobs saved');
                process.exit(0);
              })
              .catch(e => {
                console.error('❌ Error:', e.message);
                process.exit(1);
              });
          "
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}

  # ⚡ Incremental SEO: publish ke minutes me naye URLs live
  # (sitemap+meta+news+nav+IndexNow). Spark-safe (~25 reads), self-gating.
  seo-quick-add:
    needs: [scrape]
    if: needs.scrape.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout (local action se pehle zaroori)
        uses: actions/checkout@v4

      - name: "⚡ SEO Quick-Add (incremental: job)"
        uses: ./.github/actions/seo-quick-add
        with:
          type: job
          firebase-service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.SERVICE_ACCOUNT_JSON }}
          ftp-server: ${{ secrets.FTP_SERVER }}
          ftp-username: ${{ secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          ftp-server-dir: ${{ secrets.FTP_SERVER_DIR }}
