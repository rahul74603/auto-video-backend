name: StudyGyaan PDF Generator

# NOTE: this workflow used to be invalid YAML — the automation guard step was
# placed directly under `jobs:` instead of inside a job, so `automation_check`
# never ran and every later `if: steps.automation_check...` evaluated to false.
# It is now a proper two-job workflow with a real output.

on:
  workflow_dispatch: # मैन्युअल बटन
  schedule:
    - cron: '0 5 * * *' # रोज़ सुबह 10:30 AM IST

permissions:
  contents: read

jobs:
  # 🛑 Automation guard
  check-automation:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.automation_check.outputs.enabled }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🛑 Check Automation Switch (pdf_gen)
        id: automation_check
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        working-directory: ai_backend
        run: |
          npm install --no-save --ignore-scripts --legacy-peer-deps axios firebase-admin 2>&1 | tail -n 5 || true
          STATUS=0
          node check_automation.js pdf_gen || STATUS=$?
          if [ "$STATUS" = "78" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "⏸️ pdf_gen paused — skipping workflow"
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

  pdf-engine:
    needs: check-automation
    if: needs.check-automation.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          # Ghostscript इन्सटॉल करें ताकि PDF कंप्रेस हो सके
          sudo apt-get update && sudo apt-get install -y ghostscript
          npm install --legacy-peer-deps
          npm install puppeteer firebase-admin dotenv @google/generative-ai --legacy-peer-deps

      - name: 🔥 Run AutoPDF Engine
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node ai_backend/autoPdf.js
