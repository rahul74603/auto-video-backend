name: Auto Long Video Maker

# NOTE: this workflow was previously fully commented out (disabled) AND its
# automation guard step was nested directly under `jobs:` (invalid YAML).
# It is now valid YAML again with a proper two-job guard structure.
#
# The schedule is intentionally left commented out so the workflow does NOT
# start generating long videos on its own. To go live, uncomment:
#
#   schedule:
#     - cron: '0 1 * * *'   # सुबह 06:30 AM IST (01:00 UTC)
#     - cron: '0 13 * * *'  # शाम 06:30 PM IST (13:00 UTC)
#
# Manual trigger (Actions → Auto Long Video Maker → Run workflow) always works.

on:
  # schedule:
  #   - cron: '0 1 * * *'   # सुबह 06:30 AM IST (01:00 UTC)
  #   - cron: '0 13 * * *'  # शाम 06:30 PM IST (13:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 🛑 Automation guard
  check-automation:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.automation_check.outputs.enabled }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🛑 Check Automation Switch (long_video)
        id: automation_check
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        working-directory: ai_backend
        run: |
          npm install --no-save --ignore-scripts --legacy-peer-deps axios firebase-admin 2>&1 | tail -n 5 || true
          STATUS=0
          node check_automation.js long_video || STATUS=$?
          if [ "$STATUS" = "78" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "⏸️ long_video paused — skipping workflow"
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

  run-long-video:
    needs: check-automation
    if: needs.check-automation.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          if [ -d "ai_backend" ]; then cd ai_backend && npm install --legacy-peer-deps || true; fi

      - name: Generate Long Video
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_KEY_JSON: ${{ secrets.TTS_KEY_JSON }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node ai_backend/long_video.js
