name: 🎬 Auto Video Generator

# LEGACY / EXTERNAL TRIGGER PATH — kept fully working.
#   Firebase Cloud Function (or any external caller)
#   → repository_dispatch → this workflow → autoVideo.js → FFmpeg → YouTube
#
# The new billing-independent path is .github/workflows/video_dispatcher.yml.
# Both call ai_backend/video_state.js `claim()` before rendering, so if the old
# Firebase trigger starts working again it can never create a duplicate video.

on:
  repository_dispatch:
    types: [generate_video, generate_job_video, generate_fasttrack_video]

# One render per content item; different items still run in parallel.
concurrency:
  group: video-${{ github.event.client_payload.jobData.slug || github.event.client_payload.jobData.id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ai_backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ai_backend/package-lock.json

      - name: 🔧 System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: 📦 NPM Install (npm ci — package-lock.json preserved)
        run: npm ci

      - name: 🛑 Check Automation Switch (video_maker)
        id: automation_check
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          STATUS=0
          node check_automation.js video_maker || STATUS=$?
          if [ "$STATUS" = "78" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "⏸️ video_maker paused — skipping workflow"
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

      # SECURITY: client_payload comes from whoever sends the repository_dispatch,
      # so it is untrusted. Never interpolate it into a shell script — pass it
      # through env vars, which the shell treats as data, not code.
      - name: 🔍 Debug Data
        if: steps.automation_check.outputs.enabled == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TYPE: ${{ github.event.action }}
          JOB_TITLE:  ${{ github.event.client_payload.jobData.title }}
          JOB_SLUG:   ${{ github.event.client_payload.jobData.slug }}
          JOB_CAT:    ${{ github.event.client_payload.jobData.category }}
          JOB_TYPE:   ${{ github.event.client_payload.jobData.type }}
        run: |
          echo "================================"
          echo "Event  : $EVENT_NAME"
          echo "Type   : $EVENT_TYPE"
          echo "Title  : $JOB_TITLE"
          echo "Slug   : $JOB_SLUG"
          echo "Cat    : $JOB_CAT"
          echo "JobType: $JOB_TYPE"
          echo "================================"

      - name: 🎬 Generate Video
        if: steps.automation_check.outputs.enabled == 'true'
        env:
          JOB_DATA:              ${{ toJson(github.event.client_payload.jobData) }}
          GMAIL_CREDENTIALS:     ${{ secrets.GMAIL_CREDENTIALS }}
          YOUTUBE_TOKEN:         ${{ secrets.YOUTUBE_TOKEN }}
          TTS_KEY_JSON:          ${{ secrets.TTS_KEY_JSON }}
          SERVICE_ACCOUNT_JSON:  ${{ secrets.SERVICE_ACCOUNT_JSON }}
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN:         ${{ secrets.FB_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_LINK: ${{ secrets.TELEGRAM_CHANNEL_LINK }}
          TELEGRAM_CHANNEL_NAME: ${{ secrets.TELEGRAM_CHANNEL_NAME }}
        run: node autoVideo.js

      - name: ✅ Success
        if: success()
        env:
          JOB_TITLE: ${{ github.event.client_payload.jobData.title }}
          JOB_TYPE:  ${{ github.event.client_payload.jobData.type }}
        run: |
          echo "🎉 Video YouTube पर Live!"
          echo "Title: $JOB_TITLE"
          echo "Type:  $JOB_TYPE"

      - name: ❌ Failed
        if: failure()
        env:
          JOB_TITLE: ${{ github.event.client_payload.jobData.title }}
        run: |
          echo "💥 Video fail!"
          echo "Title: $JOB_TITLE"
