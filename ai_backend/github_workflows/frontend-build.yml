name: Frontend Production Build

# Build a real production Vite bundle and publish it as a downloadable artifact
# (dist.zip). This is for manual cPanel uploads only — no automatic deployment.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-production-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend dist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run production build
        env:
          # The build guard must validate the real production Firebase settings
          # for this artifact. GitHub sets CI=true by default, which would let
          # scripts/assert-env.mjs skip the check, so we run it as a normal build.
          CI: "false"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Verify dist output
        run: |
          test -d dist
          test -f dist/index.html
          test -d dist/assets
          echo "dist verified:"
          find dist -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create build metadata
        run: |
          mkdir -p dist
          cat > dist/build-info.txt <<EOF
          commit=${{ github.sha }}
          branch=${{ github.ref_name }}
          workflow=${{ github.workflow }}
          run=${{ github.run_number }}
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

      - name: Package dist into dist.zip
        run: |
          rm -f dist.zip
          zip -r dist.zip dist

      - name: Verify dist.zip contains dist/index.html
        run: |
          test -f dist.zip
          unzip -l dist.zip | grep -q "dist/index.html"
          unzip -l dist.zip | grep -q "dist/assets/"
          ls -lh dist.zip

      - name: Upload production dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: studygyaan-production-dist
          path: dist.zip
          if-no-files-found: error
          retention-days: 14
