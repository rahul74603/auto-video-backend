name: Deploy Firebase Functions Only

# 100% Spark-plan-safe deploy for studygyaan.in
# - firebase-tools v11 use kar rahe (v12/v13 me extensions Blaze check hai jo Spark pe fail karta hai)
# - Deploy se pehle firebase.json ko sanitize karte hain (extensions/dataConnect keys hata dete hain)
# - Sirf HTTP functions deploy honge (onIndexPing_* triggers Blaze/EventArc maangte hain, unhe chhod diya)

on:
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend app shell
        run: npm run build

      - name: Install Functions dependencies
        working-directory: ai_backend
        run: npm ci --legacy-peer-deps

      - name: Package app shell for social-bot SEO
        run: cp dist/index.html ai_backend/index.html

      - name: Sanitize firebase.json (remove extensions/dataConnect keys that v11 doesn't understand and v13 Blaze-checks)
        run: |
          node -e "
            const fs = require('fs');
            const path = 'firebase.json';
            const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
            delete cfg.extensions;
            delete cfg.dataconnect;
            delete cfg.dataConnect;
            fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
            console.log('firebase.json sanitized. Top keys:', Object.keys(cfg));
          "
          cat firebase.json

      - name: Install Firebase CLI v11 (last v11 — no extensions support = no Blaze plan error)
        run: npm install -g firebase-tools@11.30.0

      - name: Verify firebase-tools version
        run: firebase --version

      - name: Deploy selected Firebase Functions safely
        run: firebase deploy --only functions:serverSideMetaTags,functions:rssFeed,functions:generateSitemapIndex,functions:generateSitemapMain,functions:generateSitemapBlogs,functions:generateSitemapJobs,functions:generateSitemapTests,functions:generateSitemapStories,functions:generateSitemapUpdates,functions:generateSitemapNews,functions:generateSitemapCourses,functions:generateSitemapMaterials,functions:generateSitemap,functions:generateRss,functions:pingIndexNow,functions:bulkIndexNow,functions:recentUrls,functions:recentUrlsTxt --project studymaterial-406ad --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
