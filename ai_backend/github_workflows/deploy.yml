name: Deploy Firebase Functions Only

# ⚠️ Staging copy of .github/workflows/deploy.yml — the bot token cannot push
# into .github/workflows/, so fixes land here and tools/sync-workflows.ps1
# copies them to .github/workflows/ on a local machine.
#
# Spark / non-Blaze: ai_backend/package.json "main" is seo_export.js, which
# exports only these HTTP SEO functions (no secrets, schedules, Firestore
# triggers, or Extension SDK instances). firebase-tools discovers every
# export in "main", so pointing it at index.js made CI enable
# firebaseextensions + secretmanager and fail with:
#   Error: Extensions require the Blaze plan
#
# Do NOT add functions:api (or any function with `secrets:`) to this list
# while the project is on Spark.

on:
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend app shell
        run: npm run build

      - name: Install Functions dependencies
        working-directory: ai_backend
        run: npm ci --legacy-peer-deps

      - name: Package app shell for social-bot SEO
        run: cp dist/index.html ai_backend/index.html

      - name: Install Firebase CLI (v12 — v13+ Spark pe extensions Blaze check deta hai)
        run: npm install -g firebase-tools@12.9.1

      - name: Deploy selected Firebase Functions safely
        # ⚠️ onIndexPing_* Firestore v2 triggers EventArc use karte hain jo Blaze plan
        # maangta hai. Agar aap Blaze pe ho to deploy list me ye add karo:
        #   functions:onIndexPing_jobs,functions:onIndexPing_fast_track,functions:onIndexPing_blogs,
        #   functions:onIndexPing_web_stories,functions:onIndexPing_mock_tests
        # Spark plan pe ye HTTP endpoint + daily IndexNow GitHub Action kaafi hai.
        # firebase-tools@12 use ho raha hai (v13 Extensions Blaze check deta hai Spark pe)
        run: |
          firebase deploy --only "functions:serverSideMetaTags,functions:rssFeed,functions:generateSitemapIndex,functions:generateSitemapMain,functions:generateSitemapBlogs,functions:generateSitemapJobs,functions:generateSitemapTests,functions:generateSitemapStories,functions:generateSitemapUpdates,functions:generateSitemapNews,functions:generateSitemapCourses,functions:generateSitemapMaterials,functions:generateSitemap,functions:generateRss,functions:pingIndexNow,functions:bulkIndexNow,functions:recentUrls,functions:recentUrlsTxt" --project studymaterial-406ad --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
