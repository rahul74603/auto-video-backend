name: studygyaan_app
description: StudyGyaan official Android app — Govt Jobs, Mock Tests, Blogs, Stories, Videos.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.32.0
  cloud_firestore: ^4.17.2
  firebase_auth: ^4.20.0
  google_sign_in: ^6.2.2
  firebase_messaging: ^14.9.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.6
  share_plus: ^7.2.2
  flutter_html: ^3.0.0
  # flutter_html 3.0.0 breaks with html 0.15.7+ (private matches() removed,
  # upstream issue — no fix released). Pin below 0.15.7 until flutter_html
  # is replaced (see README "Known pins").
  html: '>=0.15.5 <0.15.7'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
